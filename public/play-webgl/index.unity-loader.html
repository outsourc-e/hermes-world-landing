<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HermesWorld - Unity WebGL Preview</title>
<meta name="description" content="HermesWorld V1 preview - explore the Training Grounds in your browser. Single-player offline demo." />
<meta name="theme-color" content="#03080c" />
<link rel="icon" href="/assets/hermesworld/art/hermesworld-logo-h.png" />
<style>
  html,body{margin:0;background:#020608;color:#fff4dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden;}
  #unity-container{position:fixed;inset:0;display:grid;place-items:center;}
  #unity-canvas{background:#000;width:100vw;height:100vh;display:block;}
  #unity-loading-bar{position:fixed;left:0;right:0;bottom:0;height:6px;background:rgba(244,198,109,.15);}
  #unity-progress-bar-empty{width:100%;height:100%;background:transparent;}
  #unity-progress-bar-full{height:100%;width:0;background:linear-gradient(90deg,#f4c66d,#ffd97a);transition:width .25s;}
  .hw-boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,rgba(244,198,109,.18),transparent 38%),#020608;color:#f4c66d;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:900;z-index:10;}
  .hw-boot .sigil{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:url('/assets/hermesworld/art/hermesworld-logo-h.png') center/cover;box-shadow:0 0 60px rgba(244,198,109,.35);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}
  .hw-boot .label{text-align:center;}
  #unity-footer{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;color:rgba(244,198,109,.5);font-size:10px;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;}
  .hw-back{position:fixed;top:14px;left:14px;color:#f4c66d;background:rgba(244,198,109,.12);border:1px solid rgba(244,198,109,.3);border-radius:8px;padding:6px 12px;text-decoration:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;z-index:20;backdrop-filter:blur(4px);}
  .hw-back:hover{background:rgba(244,198,109,.22);}
</style>
</head>
<body>
<a href="/" class="hw-back">← Back to HermesWorld</a>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div class="hw-boot" id="hw-boot">
  <div class="label">
    <div class="sigil"></div>
    Loading HermesWorld...
  </div>
</div>
<div id="unity-loading-bar"><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
<div id="unity-footer">HermesWorld V1 Preview · WebGL · Single-player demo</div>
<script>
  var buildUrl = "Build";
  var loaderUrl = buildUrl + "/HermesWorld.loader.js";
  var config = {
    dataUrl: buildUrl + "/HermesWorld.data.gz",
    frameworkUrl: buildUrl + "/HermesWorld.framework.js.gz",
    codeUrl: buildUrl + "/HermesWorld.wasm.gz",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Outsourced",
    productName: "HermesWorld",
    productVersion: "1.0",
    showBanner: function(msg, type) { console.log("[Unity]", type, msg); }
  };

  var canvas = document.querySelector("#unity-canvas");
  var progressFull = document.querySelector("#unity-progress-bar-full");
  var bootOverlay = document.querySelector("#hw-boot");

  var script = document.createElement("script");
  script.src = loaderUrl;
  script.onload = function() {
    createUnityInstance(canvas, config, function(progress) {
      progressFull.style.width = (100 * progress) + "%";
    }).then(function(instance) {
      bootOverlay.style.opacity = "0";
      setTimeout(function(){ bootOverlay.style.display = "none"; }, 600);
      document.querySelector("#unity-loading-bar").style.display = "none";
    }).catch(function(err) {
      bootOverlay.innerHTML = '<div class="label"><div class="sigil"></div>Could not load. Try desktop build.</div>';
      console.error(err);
    });
  };
  script.onerror = function() {
    bootOverlay.innerHTML = '<div class="label"><div class="sigil"></div>WebGL not ready yet. <br><br><a href="/" style="color:#f4c66d;">Back to landing</a></div>';
  };
  document.head.appendChild(script);
</script>
</body>
</html>
