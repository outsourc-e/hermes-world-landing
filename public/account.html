<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Account — HermesWorld</title>
<meta name="theme-color" content="#03080c" />
<link rel="icon" href="/assets/hermesworld/art/hermesworld-crest.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/hermesworld/art/hermesworld-crest.png" />
<style>
:root{--bg:#03080c;--panel:#071318;--panel2:#0b1820;--gold:#f4c66d;--gold2:#b97825;--gold3:#ffe5a8;--cyan:#78f0ff;--text:#fff4dc;--muted:#aab9b2;--danger:#ff8d73;--success:#7dffad;--line:rgba(244,198,109,.24)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;padding:24px;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 52% -6%,rgba(244,198,109,.16),transparent 31%),radial-gradient(circle at 83% 14%,rgba(120,240,255,.13),transparent 28%),linear-gradient(180deg,#020509 0%,#061117 45%,#020608 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.16;background-image:linear-gradient(rgba(244,198,109,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,255,.09) 1px,transparent 1px);background-size:82px 82px;mask-image:linear-gradient(to bottom,black,transparent 76%)}
a{color:inherit}.wrap{max-width:920px;margin:0 auto;padding-top:32px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:16px}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}.brand-name{font-family:"Cinzel",Georgia,serif;font-size:14px;font-weight:900;letter-spacing:.05em}.brand-name b{background:linear-gradient(180deg,#fffbe9,#c89c2a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.brand-name span{color:#9ff5ff;margin-left:2px}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.signout,.small-link{height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.04);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center}.signout:hover,.small-link:hover{background:rgba(255,255,255,.08)}.head{margin-bottom:28px}h1{font-family:"Cinzel",Georgia,serif;font-size:clamp(36px,5vw,56px);line-height:1;font-weight:900;letter-spacing:.02em;margin:0 0 12px;background:linear-gradient(180deg,#fffbe9,#c89c2a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}.welcome{color:var(--muted);font-size:16px;line-height:1.5;margin:0}.welcome strong{color:var(--text)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:start}@media(max-width:800px){.layout{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{justify-content:flex-end}}.panel,.card{background:linear-gradient(180deg,rgba(7,19,24,.96),rgba(5,13,18,.96));border:1px solid rgba(244,198,109,.2);border-radius:18px;padding:22px;box-shadow:0 28px 80px rgba(0,0,0,.28)}.panel-title{font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 18px}.form{display:grid;gap:16px}.field{display:grid;gap:7px}.label{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#c19c55}.hint{font-size:12px;color:var(--muted);line-height:1.45}.input{width:100%;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:#050d12;color:var(--text);padding:13px 14px;font-size:15px;outline:none}.input:focus{border-color:rgba(120,240,255,.5);box-shadow:0 0 0 4px rgba(120,240,255,.08)}.input[readonly]{opacity:.7;cursor:not-allowed}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.row{grid-template-columns:1fr}}.btn{min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;font-size:14px;font-weight:900;letter-spacing:.03em;background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(180deg,#ffe6a4 0%,#e9aa3c 48%,#a95d18 100%);border-color:rgba(255,229,168,.75);color:#160f07;box-shadow:0 22px 60px rgba(244,166,54,.22),inset 0 1px 0 rgba(255,255,255,.38)}.btn[disabled]{opacity:.65;cursor:not-allowed}.status{min-height:20px;font-size:13px;line-height:1.5;color:var(--muted)}.status[data-tone="error"]{color:var(--danger)}.status[data-tone="success"]{color:var(--success)}.grid{display:grid;gap:14px}.card-label{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#c19c55;margin-bottom:8px}.card-value{font-size:17px;font-weight:700;color:var(--text);word-break:break-word}.sub{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.45}.founder-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(244,198,109,.4);background:rgba(244,198,109,.1);color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-top:8px}.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#ffe6a4,#a95d18);color:#160f07;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;overflow:hidden;border:1px solid rgba(244,198,109,.35);box-shadow:0 0 40px rgba(244,198,109,.14)}.avatar img{width:100%;height:100%;object-fit:cover}.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}.actions{display:grid;gap:10px;margin-top:14px}.loading{text-align:center;padding:80px 24px;color:var(--muted)}.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(244,198,109,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="/"><img src="/assets/hermesworld/art/hermesworld-crest.png" alt="HermesWorld"><div class="brand-name"><b>Hermes</b><span>World</span></div></a>
    <div class="top-actions">
      <a class="small-link" href="https://play.hermes-world.ai/play/web/">Play</a>
      <a class="small-link" href="/">Landing</a>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading account…</p>
    </div>
  </div>
</div>

<script type="module">
  import {
    supabase,
    getCurrentSession,
    getCurrentProfile,
    normalizeUsername,
    signOut,
  } from '/assets/hermesworld/auth/supabase-client.js?v=20260606sso';

  const contentEl = document.getElementById('content');
  const signoutBtn = document.getElementById('signout');

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function initialFor(s){
    const t = String(s || '').trim();
    return t ? t[0].toUpperCase() : '?';
  }
  function setStatus(message, tone = 'muted') {
    const node = document.getElementById('save-status');
    if (!node) return;
    node.textContent = message || '';
    node.dataset.tone = tone;
  }
  function cleanHandle(value){ return String(value || '').trim().replace(/^@+/, '').slice(0, 40); }

  async function doSignOut(){
    try { await signOut(); } catch (_) {}
    try {
      Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
    } catch (_) {}
    window.location.replace('/signin/');
  }
  signoutBtn.addEventListener('click', doSignOut);

  async function loadAccount(){
    const session = await getCurrentSession();
    if (!session) {
      window.location.replace('/signin/');
      return;
    }

    let user = session.user;
    let profile = null;
    try {
      const result = await getCurrentProfile();
      user = result.user || user;
      profile = result.profile || null;
    } catch (err) {
      console.warn('account: profile load failed', err);
    }

    const meta = user.user_metadata || {};
    const provider = user.app_metadata?.provider || user.identities?.[0]?.provider || 'email';
    const email = user.email || '';
    const displayName = profile?.display_name || meta.full_name || meta.name || email.split('@')[0] || 'Adventurer';
    const username = profile?.username || '';
    const avatarUrl = profile?.avatar_url || meta.avatar_url || '';
    const discordId = profile?.discord_id || '';
    const xHandle = profile?.x_handle || '';
    let isFounder = !!profile?.is_founder;
    const founderRank = profile?.founder_rank;
    let founderTier = null;
    // LIVE founder status: the wallet gate writes to the game DB (VPS), not Supabase. Ask the
    // game-auth endpoint whether THIS account is wallet-verified, and reflect it here.
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.access_token) {
        const r = await fetch('/api/game-auth/launch', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ jwt: session.access_token }) });
        const body = await r.json().catch(()=>({}));
        if (r.ok && body && body.walletVerified === true) {
          isFounder = true;
          founderTier = body.tier || body.founderTier || null;
        }
      }
    } catch (e) { /* keep Supabase value as fallback */ }

    contentEl.innerHTML = `
      <div class="head">
        <h1>Account settings</h1>
        <p class="welcome">Signed in as <strong>${escapeHtml(email || displayName)}</strong>${isFounder ? `<br><span class="founder-pill">★ Founder${founderRank ? ` #${founderRank}` : ''}</span>` : ''}</p>
      </div>
      <div class="layout">
        <section class="panel">
          <div class="panel-title">Profile</div>
          <div class="profile-head">
            <div class="avatar">${avatarUrl ? `<img src="${escapeHtml(avatarUrl)}" alt="" referrerpolicy="no-referrer">` : escapeHtml(initialFor(displayName || email))}</div>
            <div>
              <div class="card-value">${escapeHtml(displayName)}</div>
              <div class="sub">${escapeHtml(provider)} account${username ? ` · @${escapeHtml(username)}` : ''}</div>
            </div>
          </div>
          <form id="profile-form" class="form">
            <div class="row">
              <div class="field">
                <label class="label" for="display_name">Display name</label>
                <input class="input" id="display_name" name="display_name" value="${escapeHtml(displayName)}" maxlength="80" autocomplete="name">
                <div class="hint">Shown on your HermesWorld account page.</div>
              </div>
              <div class="field">
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" value="${escapeHtml(username)}" maxlength="24" autocapitalize="none" spellcheck="false" autocomplete="nickname" placeholder="atlas_builder">
                <div class="hint">3–24 chars: lowercase letters, numbers, underscores.</div>
              </div>
            </div>
            <div class="row">
              <div class="field">
                <label class="label" for="x_handle">X handle</label>
                <input class="input" id="x_handle" name="x_handle" value="${escapeHtml(xHandle)}" maxlength="40" placeholder="outsource_">
              </div>
              <div class="field">
                <label class="label" for="discord_id">Discord</label>
                <input class="input" id="discord_id" name="discord_id" value="${escapeHtml(discordId)}" maxlength="80" placeholder="username or user id">
              </div>
            </div>
            <div class="field">
              <label class="label" for="avatar_url">Avatar URL</label>
              <input class="input" id="avatar_url" name="avatar_url" value="${escapeHtml(avatarUrl)}" placeholder="https://...">
              <div class="hint">Google avatars are prefilled. You can replace this with any image URL.</div>
            </div>
            <button class="btn primary" id="save-profile" type="submit">Save account settings</button>
            <div id="save-status" class="status" aria-live="polite"></div>
          </form>
        </section>

        <aside class="grid">
          <div class="card">
            <div class="card-label">Email</div>
            <div class="card-value">${escapeHtml(email || '—')}</div>
            <div class="sub">Email is managed by Supabase Auth. Use Google or email sign-in to change login identity later.</div>
          </div>
          <div class="card">
            <div class="card-label">Provider</div>
            <div class="card-value">${escapeHtml(provider)}</div>
            <div class="sub">Created ${new Date(user.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
          </div>
          <div class="card">
            <div class="card-label">Founder status</div>
            <div class="card-value">${isFounder ? `★ ${founderTier ? ({holder:'Founder (Holder)',cavalier:'Founder — Cavalier',dragonlord:'Founder — Dragonlord'}[founderTier] || 'Founder') : 'Founder'}${founderRank ? ` #${founderRank}` : ''}` : 'Not assigned yet'}</div>
            <div class="sub">${isFounder ? 'Verified holder — your rewards are in your in-game shop.' : 'Verify your wallet to unlock Founder status + rewards.'}</div>
            ${isFounder ? '' : '<a class="btn" style="margin-top:12px" href="/#verify">Verify wallet</a>'}
          </div>
          <div class="actions">
            <a class="btn primary" href="https://play.hermes-world.ai/play/web/">Enter HermesWorld →</a>
            ${!username ? '<a class="btn" href="/reserve">Claim founder name</a>' : ''}
            <button class="btn" id="secondary-signout" type="button">Sign out</button>
          </div>
        </aside>
      </div>
    `;

    document.getElementById('secondary-signout')?.addEventListener('click', doSignOut);

    const usernameInput = document.getElementById('username');
    usernameInput.addEventListener('input', () => {
      const normalized = normalizeUsername(usernameInput.value);
      if (usernameInput.value !== normalized) usernameInput.value = normalized;
    });

    document.getElementById('profile-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const saveBtn = document.getElementById('save-profile');
      const payload = {
        id: user.id,
        username: normalizeUsername(document.getElementById('username').value),
        display_name: document.getElementById('display_name').value.trim().slice(0, 80),
        avatar_url: document.getElementById('avatar_url').value.trim() || null,
        discord_id: document.getElementById('discord_id').value.trim() || null,
        x_handle: cleanHandle(document.getElementById('x_handle').value) || null,
      };

      if (payload.username && payload.username.length < 3) {
        setStatus('Username must be at least 3 characters, or leave it blank.', 'error');
        return;
      }
      if (!payload.username) payload.username = null;
      if (!payload.display_name) payload.display_name = email.split('@')[0] || 'Adventurer';

      saveBtn.disabled = true;
      setStatus('Saving…');
      try {
        const { error } = await supabase
          .from('profiles')
          .upsert(payload, { onConflict: 'id' });
        if (error) throw error;
        // Keep auth metadata roughly aligned for UI surfaces using user_metadata.
        await supabase.auth.updateUser({ data: { full_name: payload.display_name, avatar_url: payload.avatar_url } }).catch(() => {});
        setStatus('Saved. Refreshing account details…', 'success');
        setTimeout(loadAccount, 650);
      } catch (error) {
        const msg = error?.message || 'Could not save account settings.';
        if (msg.includes('duplicate') || msg.includes('unique')) {
          setStatus('That username is already taken. Try another.', 'error');
        } else {
          setStatus(msg, 'error');
        }
      } finally {
        saveBtn.disabled = false;
      }
    });
  }

  loadAccount();
</script>
</body>
</html>
