<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Account — HermesWorld</title>
<meta name="theme-color" content="#03080c" />
<link rel="icon" href="/assets/hermesworld/art/hermesworld-crest.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/hermesworld/art/hermesworld-crest.png" />
<style>
:root{--bg:#03080c;--panel:#071318;--panel2:#0b1820;--gold:#f4c66d;--gold2:#b97825;--gold3:#ffe5a8;--cyan:#78f0ff;--text:#fff4dc;--muted:#aab9b2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;padding:24px;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 52% -6%,rgba(244,198,109,.16),transparent 31%),radial-gradient(circle at 83% 14%,rgba(120,240,255,.13),transparent 28%),linear-gradient(180deg,#020509 0%,#061117 45%,#020608 100%)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.16;background-image:linear-gradient(rgba(244,198,109,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(120,240,255,.09) 1px,transparent 1px);background-size:82px 82px;mask-image:linear-gradient(to bottom,black,transparent 76%)}
.wrap{max-width:760px;margin:0 auto;padding-top:32px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.brand-name{font-family:"Cinzel",Georgia,serif;font-size:14px;font-weight:900;letter-spacing:.05em}
.brand-name b{background:linear-gradient(180deg,#fffbe9,#c89c2a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.brand-name span{color:#9ff5ff;margin-left:2px}
.signout{height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.04);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:background .2s}
.signout:hover{background:rgba(255,255,255,.08)}
.head{margin-bottom:32px}
h1{font-family:"Cinzel",Georgia,serif;font-size:clamp(36px,5vw,52px);line-height:1;font-weight:900;letter-spacing:.02em;margin:0 0 12px;background:linear-gradient(180deg,#fffbe9,#c89c2a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.welcome{color:var(--muted);font-size:16px;line-height:1.5}
.welcome strong{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid rgba(244,198,109,.2);border-radius:16px;padding:24px}
.card-label{font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#c19c55;margin-bottom:12px}
.card-value{font-size:18px;font-weight:600;color:var(--text)}
.card .sub{margin-top:4px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn-action{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border:1px solid rgba(244,198,109,.25);border-radius:14px;background:rgba(244,198,109,.04);color:var(--text);text-decoration:none;font-size:15px;font-weight:600;transition:background .2s,border-color .2s,transform .15s}
.btn-action:hover{background:rgba(244,198,109,.08);border-color:rgba(244,198,109,.45);transform:translateY(-1px)}
.btn-action.primary{background:linear-gradient(180deg,#ffe6a4,#e9aa3c,#a95d18);border-color:rgba(255,229,168,.75);color:#160f07;box-shadow:0 22px 60px rgba(244,166,54,.25)}
.btn-action.primary:hover{filter:brightness(1.08)}
.btn-action .arrow{font-size:18px;color:rgba(255,255,255,.45)}
.btn-action.primary .arrow{color:#160f07}
.founder-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid rgba(244,198,109,.4);background:rgba(244,198,109,.1);color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.loading{text-align:center;padding:80px 24px;color:var(--muted)}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(244,198,109,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="/"><img src="/assets/hermesworld/art/hermesworld-crest.png" alt="HermesWorld"><div class="brand-name"><b>Hermes</b><span>World</span></div></a>
    <button class="signout" id="signout">Sign out</button>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading account…</p>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.74.0';

  const SUPABASE_URL = 'https://gwcdgbbbsykfhgnlfzxs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3Y2RnYmJic3lrZmhnbmxmenhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwMDE2NDcsImV4cCI6MjA4NTU3NzY0N30.LlXFUR2H9SE6SViXLoPQw_yYm2DGBx2zmw0ayZyykbQ';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: localStorage }
  });

  const contentEl = document.getElementById('content');
  const signoutBtn = document.getElementById('signout');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  signoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.replace('/');
  });

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.replace('/signin');
      return;
    }
    const user = session.user;

    // Try to load profile (may not exist if profiles table not seeded yet)
    let profile = null;
    try {
      const { data } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
      profile = data;
    } catch {}

    const displayName = profile?.display_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Adventurer';
    const username = profile?.username || null;
    const isFounder = !!profile?.is_founder;
    const founderRank = profile?.founder_rank;

    contentEl.innerHTML = `
      <div class="head">
        <h1>Welcome, ${escapeHtml(displayName)}.</h1>
        <p class="welcome">Signed in as <strong>${escapeHtml(user.email || '')}</strong>${isFounder ? '<br><span class="founder-pill">★ Founder${founderRank ? ` #${founderRank}` : ''}</span>' : ''}</p>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-label">Username</div>
          <div class="card-value">${username ? escapeHtml(username) : '—'}</div>
          ${!username ? '<div class="sub"><a href="/reserve" style="color:var(--gold);text-decoration:none">Reserve your name →</a></div>' : ''}
        </div>
        <div class="card">
          <div class="card-label">Member since</div>
          <div class="card-value">${new Date(user.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn-action primary" href="/play/">
          <span>Enter HermesWorld →</span>
          <span class="arrow">→</span>
        </a>
        ${!username ? '<a class="btn-action" href="/reserve"><span>Claim your founder name</span><span class="arrow">→</span></a>' : ''}
        <a class="btn-action" href="/">
          <span>Back to landing</span>
          <span class="arrow">→</span>
        </a>
      </div>
    `;
  })();
</script>
</body>
</html>
