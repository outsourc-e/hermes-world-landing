<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Play HermesWorld - Free Agent RPG</title>
<meta name="description" content="Play HermesWorld free in your browser. No signup. Your character, quests, inventory, sigils, and zone progress save locally." />
<meta name="theme-color" content="#03080c" />
<link rel="icon" href="/assets/hermesworld/art/hermesworld-logo-h.png" />
<link rel="stylesheet" href="/assets/styles-Ceh-ZHA6.css" />
<style>
html,body{margin:0;background:#020608;color:#fff4dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
#root{min-height:100vh;}
.hw-boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,rgba(244,198,109,.18),transparent 38%),#020608;}
.hw-boot__inner{text-align:center;color:#f4c66d;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:900;}
.hw-boot__sigil{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:url('/assets/hermesworld/art/hermesworld-logo-h.png') center/cover;box-shadow:0 0 60px rgba(244,198,109,.35);}
</style>
</head>
<body>
<div id="root"><div class="hw-boot"><div class="hw-boot__inner"><div class="hw-boot__sigil"></div>Entering HermesWorld...</div></div></div>
<script type="module" src="/assets/play-standalone.js"></script>
<a class="hw-account-fixed" data-google-signin href="/signin/" style="position:fixed;top:14px;right:14px;z-index:9999;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(244,198,109,.12);border:1px solid rgba(244,198,109,.45);color:#f4c66d;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.04em;font-family:Inter,ui-sans-serif,system-ui,sans-serif;"><span data-google-label>Sign in</span></a>
<script type="module" src="/assets/hermesworld/auth/landing-auth.js?v=20260606sso"></script>
</body>
</html>
