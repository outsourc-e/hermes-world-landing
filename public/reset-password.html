<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password · HermesWorld</title>
  <meta name="theme-color" content="#03080c" />
  <style>
    :root{--bg:#03080c;--panel:#09161d;--gold:#f4c66d;--gold2:#ffebba;--cyan:#78f0ff;--text:#fff4dc;--muted:#9bb0a9;--line:rgba(244,198,109,.22);--danger:#ff8d73;--success:#7dffad}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(244,198,109,.18),transparent 25%),radial-gradient(circle at 80% 10%,rgba(120,240,255,.12),transparent 30%),linear-gradient(180deg,#020608 0%,#071319 45%,#020608 100%);color:var(--text);display:grid;place-items:center;padding:24px}
    a{color:var(--gold);text-decoration:none}
    .card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(9,22,29,.94),rgba(3,9,12,.96));padding:32px 28px 28px;box-shadow:0 40px 120px rgba(0,0,0,.5),0 0 80px rgba(244,198,109,.08)}
    .brand{font-family:Georgia,serif;font-size:22px;color:var(--gold);margin:0 0 4px}
    .eyebrow{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid rgba(244,198,109,.24);background:rgba(244,198,109,.08);color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
    .title{font-family:Georgia,serif;font-size:30px;line-height:1.05;letter-spacing:-.03em;margin:0 0 8px}
    .copy{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
    .input{width:100%;box-sizing:border-box;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#050d12;color:var(--text);padding:14px 16px;font-size:16px;outline:none;margin-bottom:16px}
    .input:focus{border-color:rgba(244,198,109,.5)}
    .btn{width:100%;min-height:52px;border-radius:14px;border:1px solid rgba(255,229,168,.75);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#ffe6a4 0%,#e9aa3c 48%,#a95d18 100%);color:#160f07;cursor:pointer;box-shadow:0 22px 60px rgba(244,166,54,.22),inset 0 1px 0 rgba(255,255,255,.38)}
    .btn[disabled]{opacity:.55;cursor:not-allowed}
    .status{margin-top:16px;font-size:14px;line-height:1.5;min-height:20px}
    .status.err{color:var(--danger)}
    .status.ok{color:var(--success)}
    .foot{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">HermesWorld</div>
    <span class="eyebrow">Password Reset</span>
    <h1 class="title" id="title">Choose a new password</h1>
    <p class="copy" id="copy">Enter a new password for your HermesWorld account.</p>

    <form id="form">
      <label for="pw">New password</label>
      <input class="input" id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required />
      <label for="pw2">Confirm password</label>
      <input class="input" id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" minlength="6" required />
      <button class="btn" id="submit" type="submit">Reset Password</button>
    </form>
    <div class="status" id="status"></div>
    <div class="foot"><a href="https://play.hermes-world.ai/play/web/">← Back to HermesWorld</a></div>
  </div>

  <script>
    var BRIDGE = "https://play.hermes-world.ai/play/web/reset-password";
    var params = new URLSearchParams(location.search);
    var token = params.get("token") || "";
    var id = params.get("id") || "";
    var form = document.getElementById("form");
    var statusEl = document.getElementById("status");
    var submitBtn = document.getElementById("submit");

    if (!token || !id) {
      document.getElementById("title").textContent = "Invalid reset link";
      document.getElementById("copy").textContent = "This reset link is missing or malformed. Request a new one from the sign-in page.";
      form.style.display = "none";
    }

    function setStatus(msg, cls){ statusEl.textContent = msg; statusEl.className = "status " + (cls||""); }

    form.addEventListener("submit", function(e){
      e.preventDefault();
      var pw = document.getElementById("pw").value;
      var pw2 = document.getElementById("pw2").value;
      if (pw.length < 6) { setStatus("Password must be at least 6 characters.", "err"); return; }
      if (pw !== pw2) { setStatus("Passwords do not match.", "err"); return; }
      submitBtn.disabled = true;
      setStatus("Resetting…", "");
      fetch(BRIDGE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: Number(id), token: token, newPassword: pw })
      }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
        .then(function(res){
          if (res.ok && res.j && res.j.ok) {
            setStatus("✓ Password reset! You can now log in.", "ok");
            form.style.display = "none";
            setTimeout(function(){ location.href = "https://play.hermes-world.ai/play/web/"; }, 2500);
          } else {
            var m = (res.j && res.j.message) || "Reset failed.";
            if (/expired|invalid/i.test(m)) m = "This reset link is invalid or has expired. Request a new one.";
            setStatus(m, "err");
            submitBtn.disabled = false;
          }
        }).catch(function(){ setStatus("Network error. Try again.", "err"); submitBtn.disabled = false; });
    });
  </script>
</body>
</html>
